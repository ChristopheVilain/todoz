<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todoz</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="toolbar">
        <h1>todoz</h1>
        <div class="toolbar-actions">
          <label class="idle-setting" title="Seconds of inactivity before an open note auto-classifies">
            Idle timeout
            <input id="idle-timeout-input" type="number" min="5" step="5" />
            s
          </label>
          <button id="new-note-button" type="button">+ New Note (⌘N)</button>
        </div>
      </header>

      <section id="empty-state" class="empty-state">
        <p>No note open. Press <kbd>⌘N</kbd> / <kbd>Ctrl+N</kbd> or click "+ New Note" to capture something.</p>
      </section>

      <section id="capture-panel" class="capture-panel" hidden>
        <textarea
          id="capture-textarea"
          placeholder="Type anything. It's saved as you go — close this panel (Esc) when you're done."
        ></textarea>
        <footer class="capture-footer">
          <span id="capture-status" class="status">Draft</span>
          <button id="done-button" type="button">Done (Esc)</button>
        </footer>
      </section>
    </main>
  </body>
</html>
